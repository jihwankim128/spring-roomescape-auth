<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta content="width=device-width, initial-scale=1.0" name="viewport" />
  <title>회원가입 · RoomEscape</title>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="/styles/common.css" rel="stylesheet" />
  <link href="/styles/login.css" rel="stylesheet" />
</head>
<body>
  <nav class="top-nav">
    <div class="nav-inner">
      <a class="nav-logo" href="/">RoomEscape</a>
      <div class="nav-links">
        <a href="/">홈</a>
        <a href="/reserve">예약하기</a>
        <a href="/search">예약확인</a>
        <a data-nav-login href="/login">로그인</a>
        <a class="active" data-nav-signup href="/signup">회원가입</a>
        <span class="nav-user" data-nav-user hidden></span>
        <a data-nav-admin href="/admin" hidden>관리자</a>
      </div>
    </div>
  </nav>

  <main class="login-page">
    <form class="login-form" data-role="signup-form">
      <h1 class="page-title">회원가입</h1>
      <label for="signupName">이름</label>
      <input id="signupName" maxlength="20" name="name" placeholder="이름을 입력하세요" type="text" />
      <button type="submit">회원가입</button>
      <a class="form-link" href="/login">이미 가입했다면 로그인</a>
      <div class="login-message" data-role="signup-message"></div>
    </form>
  </main>

  <script src="/js/common/nav.js" type="module"></script>
  <script src="/js/signup/main.js" type="module"></script>
</body>
</html>
